name: Website Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "nightly-*"
  workflow_dispatch:

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Check out CellScript examples
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CellScript-Labs/CellScript
          ref: nightly-0.23
          path: cellscript-source
          sparse-checkout: |
            docs/wiki
            examples
            proposals/evolving-dob/evolving-dob-profile-v1

      - name: Check out Registry package source
        working-directory: cellscript-source
        run: git submodule update --init --depth 1 proposals/evolving-dob/evolving-dob-profile-v1

      - name: Generate registry website data
        env:
          CELLSCRIPT_REGISTRY_ROOT: ${{ github.workspace }}/cellscript-source
        run: npm run prepare:registry

      - name: Check generated registry data is committed
        run: |
          if [[ -n "$(git status --porcelain -- src/data/registry-packages.json)" ]]; then
            echo "src/data/registry-packages.json is stale or missing"
            git status --short -- src/data/registry-packages.json
            git diff -- src/data/registry-packages.json
            exit 1
          fi

      - name: Build website
        env:
          CELLSCRIPT_REPO_ROOT: ${{ github.workspace }}/cellscript-source
        run: npm run build

      - name: Upload website dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellscript-website-dist
          path: dist/
          if-no-files-found: error
